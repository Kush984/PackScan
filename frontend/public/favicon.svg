<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#cardShadow)" />

  <!-- Outer Precision Viewfinder Optical Corners -->
  <!-- Top-Left Corner -->
  <path d="M 64 128 L 64 84 A 20 20 0 0 1 84 64 L 128 64" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <!-- Top-Right Corner -->
  <path d="M 384 64 L 428 64 A 20 20 0 0 1 448 84 L 448 128" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <!-- Bottom-Left Corner -->
  <path d="M 64 384 L 64 428 A 20 20 0 0 0 84 448 L 128 448" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />
  <!-- Bottom-Right Corner -->
  <path d="M 384 448 L 428 448 A 20 20 0 0 0 448 428 L 448 384" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />

  <!-- Stylized Isometric Package Geometry -->
  <!-- Package Backplate Frame -->
  <rect x="110" y="110" width="292" height="292" rx="32" fill="#1E293B" stroke="#475569" stroke-width="3" />

  <!-- Barcode Stripes on Package (Digital Scan Grounding) -->
  <g opacity="0.85">
    <line x1="146" y1="146" x2="146" y2="250" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
    <line x1="162" y1="146" x2="162" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="174" y1="146" x2="174" y2="250" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
    <line x1="192" y1="146" x2="192" y2="250" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="206" y1="146" x2="206" y2="250" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
    <line x1="220" y1="146" x2="220" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="232" y1="146" x2="232" y2="250" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <line x1="248" y1="146" x2="248" y2="250" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="262" y1="146" x2="262" y2="250" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
    <line x1="276" y1="146" x2="276" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="288" y1="146" x2="288" y2="250" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
    <line x1="304" y1="146" x2="304" y2="250" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <line x1="320" y1="146" x2="320" y2="250" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
    <line x1="334" y1="146" x2="334" y2="250" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="346" y1="146" x2="346" y2="250" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" />
    <line x1="362" y1="146" x2="362" y2="250" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Glowing Laser Scan Line Crossing Barcode -->
  <line x1="90" y1="200" x2="422" y2="200" stroke="url(#laserGrad)" stroke-width="8" filter="url(#glow)" />
  <line x1="110" y1="200" x2="402" y2="200" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Prominent Compliance Shield Emblem (Foreground) -->
  <g transform="translate(196, 232)">
    <!-- Shield Drop Shadow -->
    <path d="M 60 0 C 110 0 120 18 120 54 C 120 102 60 144 60 144 C 60 144 0 102 0 54 C 0 18 10 0 60 0 Z" fill="#000000" opacity="0.3" transform="translate(0, 8)" />
    <!-- Shield Body -->
    <path d="M 60 0 C 110 0 120 18 120 54 C 120 102 60 144 60 144 C 60 144 0 102 0 54 C 0 18 10 0 60 0 Z" fill="url(#shieldGrad)" stroke="#34D399" stroke-width="4" />
    <!-- Verification Checkmark inside Shield -->
    <path d="M 36 68 L 52 84 L 86 48" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Legal Metrology Gold Sparkle Accent -->
  <path d="M 374 126 L 382 144 L 400 152 L 382 160 L 374 178 L 366 160 L 348 152 L 366 144 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="374" cy="152" r="3" fill="#FFFFFF" />
</svg>